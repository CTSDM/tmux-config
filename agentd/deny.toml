# cargo deny check: run by check.sh (design.md, Rules 7).

# Linux only: the daemon reads /proc and talks to tmux and Hyprland.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
ignore = []

# A dependency passes when one of its license choices is here. New entries
# need the architect's OK, like new crates.
[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true # agentd itself: publish = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
