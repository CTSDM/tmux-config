# The desktop's agentd (this package), what both it and a server's small
# binary share (common/), and that binary (server/): design.md, "Remote panes".
[workspace]
members = ["common", "server"]

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
description = "Resident agent layer for tmux: hooks, states, sounds, notifications (docs/daemon/design.md)"
publish = false

# New crates need the architect's OK (design.md, Rules 7).
[dependencies]
agentd-common = { path = "common", version = "0.1.0" }
regex = "1.13.1"
# Already in the tree through zbus; safe wrappers for flock, kill, setsid,
# and for remote panes the pty, the terminal and poll.
rustix = { version = "1.1.5", features = ["event", "fs", "process", "pty", "stdio", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros", "signal", "process", "sync"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
