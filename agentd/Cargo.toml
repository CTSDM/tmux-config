[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
description = "Resident agent layer for tmux: hooks, states, sounds, notifications (docs/daemon/design.md)"
publish = false

# New crates need the architect's OK (design.md, Rules 7).
[dependencies]
regex = "1.13.1"
# Already in the tree through zbus; safe wrappers for flock, kill, setsid.
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros", "signal", "process", "sync"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
