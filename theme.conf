# theme.conf: how tmux looks. Catppuccin Mocha.
#
# A solid two-line bar at the top, lighter than the panes so it never blends in:
#   line 1 (surface0)  this session as a pill, then its windows; the current
#                      one is a raised tab
#   line 2 (base)      every session that runs agents, with their states, and
#                      totals on the right (words dropped under 120 columns);
#                      "needs you" is a filled pill
# Pane labels sit on the bottom border, away from the bar.
# The space's color (mauve, blue...) marks where you are. Yellow, peach, green,
# red and teal only ever mean agent states (agents/agents.conf has the glyphs).

# --- Palette -------------------------------------------------------------------

set -g @thm-crust    '#11111b'
set -g @thm-mantle   '#181825'
set -g @thm-base     '#1e1e2e'
set -g @thm-surface0 '#313244'
set -g @thm-surface1 '#45475a'
set -g @thm-overlay0 '#6c7086'
set -g @thm-overlay1 '#7f849c'
set -g @thm-overlay2 '#9399b2'
set -g @thm-subtext0 '#a6adc8'
set -g @thm-text     '#cdd6f4'
set -g @thm-mauve    '#cba6f7'
set -g @thm-blue     '#89b4fa'
set -g @thm-yellow   '#f9e2af'
set -g @thm-green    '#a6e3a1'
set -g @thm-peach    '#fab387'
set -g @thm-red      '#f38ba8'
set -g @thm-teal     '#94e2d5'

# Agent states, read by agents.conf
set -gF @ac-working '#{@thm-yellow}'
set -gF @ac-needs   '#{@thm-peach}'
set -gF @ac-done    '#{@thm-green}'
set -gF @ac-error   '#{@thm-red}'
set -gF @ac-compact '#{@thm-teal}'
set -gF @ac-idle    '#{@thm-overlay1}'
set -gF @ac-dim     '#{@thm-overlay0}'

# Rounded pill ends. kitty draws these itself, whatever the font.
set -g @cap-l ""
set -g @cap-r ""

# This session's color: its space's (agent-spaces sets @space-color), or
# peach while peeking into another session.
set -g @session-color '#{?#{m:_peek-*,#{session_name}},#{@thm-peach},#{?@space-color,#{@space-color},#{@thm-mauve}}}'

# --- Line 1: session and windows ----------------------------------------------

set -g status 2
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -gF status-style 'bg=#{@thm-surface0},fg=#{@thm-text}'

set -g status-left-length 60
set -g status-left '#[fg=#{E:@session-color}]#{@cap-l}#[bg=#{E:@session-color},fg=#{@thm-crust},bold]#{?#{m:_peek-*,#{session_name}},peek · #{session_group},#S}#[fg=#{E:@session-color},bg=#{@thm-surface0},nobold]#{@cap-r} '

set -g window-status-separator ''
set -g window-status-format '#[fg=#{@thm-overlay2}] #I #{?#{P:#{E:@agent-glyph}},#{P:#{E:@agent-glyph}} ,}#[fg=#{@thm-subtext0}]#{=/22/…:#{E:@agent-task}}#{?window_zoomed_flag,#[fg=#{@thm-overlay2}] z,}#{?window_bell_flag,#[fg=#{@thm-peach}] !,} '
set -g window-status-current-format '#[fg=#{@thm-surface1}]#{@cap-l}#[bg=#{@thm-surface1},fg=#{E:@session-color},bold]#I#[nobold] #{?#{P:#{E:@agent-glyph}},#{P:#{E:@agent-glyph}} ,}#[fg=#{@thm-text},bold]#{=/22/…:#{E:@agent-task}}#[nobold]#{?window_zoomed_flag,#[fg=#{@thm-overlay2}] z,}#[fg=#{@thm-surface1},bg=#{@thm-surface0}]#{@cap-r}'

set -g status-right-length 40
set -g status-right '#[fg=#{@thm-peach},bold]#{?client_prefix,prefix  ,}#[fg=#{@thm-overlay2},nobold]#{?#{==:#{@agent_sound},off},muted  ,}%H:%M '

# --- Line 2: the sessions of your space -------------------------------------------
#
# A template: agents/bin/agent-spaces fills it in for each space and stores the
# result in each session's @fleet-line option, which the second status line
# expands. (status-format itself stays global: setting one entry per session
# would replace the whole array for that session and blank the first line.)
#   @@LABEL@@ @@COLOR@@  the space's name and color ("all" outside any space)
#   @@FILTER@@           true for sessions shown: this space plus unassigned ones
#   @@NEEDS@@ @@DONE@@ @@WORKING@@  agent counts within the space
#   @@OTHERS@@           a chip per other space with something going on

set -g @fleet-tpl '#[fill=#{@thm-base}]#[bg=#{@thm-base}]#[align=left]#[fg=@@COLOR@@]#[bold] @@LABEL@@ #[nobold]#[fg=#{@thm-surface1}]│ #{S:#{?#{m:_peek-*,#{session_name}},,#{?#{&&:@@FILTER@@,#{W:#{P:#{E:@agent-glyph}}}},#{?#{==:#{session_name},#{client_session}},#[fg=#{@thm-surface0}]#{@cap-l}#[bg=#{@thm-surface0}]#[fg=#{@thm-text}]#[bold]#{=/16/…:session_name}#[nobold] #{W:#{P:#{E:@agent-glyph}}}#[bg=#{@thm-base}]#[fg=#{@thm-surface0}]#{@cap-r} ,#[fg=#{@thm-subtext0}] #{=/16/…:session_name} #{W:#{P:#{E:@agent-glyph}}}  },}}}#[align=right]@@OTHERS@@#{?#{!=:@@NEEDS@@,0},#[fg=#{@ac-needs}]#{@cap-l}#[bg=#{@ac-needs}]#[fg=#{@thm-base}]#[bold]▲ @@NEEDS@@#{?#{e|<:#{client_width},120},, need you}#[nobold]#[bg=#{@thm-base}]#[fg=#{@ac-needs}]#{@cap-r}  ,}#{?#{!=:@@DONE@@,0},#[fg=#{@ac-done}]✓ @@DONE@@#{?#{e|<:#{client_width},120},, done}  ,}#{?#{!=:@@WORKING@@,0},#[fg=#{@ac-working}]● @@WORKING@@#{?#{e|<:#{client_width},120},, working} ,}'
set -g 'status-format[1]' '#{E:@fleet-line}'

# --- Panes -------------------------------------------------------------------------

# Agent panes take their state's color (the "ring"). Split windows label
# each pane on its bottom border (agents.conf turns that on per window).
set -g pane-border-lines single
set -g pane-border-style 'fg=#{?@agent,#{E:@agent-color},#{@thm-surface1}}'
set -g pane-active-border-style 'fg=#{?@agent,#{E:@agent-color},#{@thm-mauve}}'
set -g pane-border-format '#{?@agent, #{E:@agent-glyph} #[fg=#{@thm-text}]#{@agent}#{?#{&&:#{==:#{@agent},claude},#{!=:#{@agent_profile},default}},#[fg=#{@thm-overlay1}]:#{@agent_profile},} #[fg=#{E:@agent-color}]#{E:@agent-label}#{?@agent_tool,#[fg=#{@thm-overlay1}] · #{=/48/…:@agent_tool},} ,#[fg=#{@thm-overlay0}] #{pane_index} #{pane_current_command} }'

# --- Messages, copy mode, menus, popups ----------------------------------------------

set -gF message-style 'bg=#{@thm-surface0},fg=#{@thm-text}'
set -gF message-command-style 'bg=#{@thm-surface0},fg=#{@thm-mauve}'
set -gF mode-style 'bg=#{@thm-surface1},fg=#{@thm-text}'
set -gF copy-mode-match-style 'bg=#{@thm-surface1},fg=#{@thm-peach}'
set -gF copy-mode-current-match-style 'bg=#{@thm-peach},fg=#{@thm-crust}'
set -gF display-panes-active-colour '#{@thm-mauve}'
set -gF display-panes-colour '#{@thm-overlay0}'
set -gF clock-mode-colour '#{@thm-mauve}'
set -gF menu-style 'bg=#{@thm-base},fg=#{@thm-text}'
set -gF menu-selected-style 'bg=#{@thm-surface0},fg=#{@thm-mauve}'
set -gF menu-border-style 'fg=#{@thm-surface1}'
set -g popup-border-lines rounded
set -gF popup-style 'bg=#{@thm-base}'
set -gF popup-border-style 'fg=#{@thm-surface1},bg=#{@thm-base}'
