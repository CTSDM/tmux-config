# tmux configuration. Prefix: Alt+a. Reload: prefix+R.
#
#   theme.conf          colors, status bar, borders (Catppuccin Mocha)
#   agents/agents.conf  agent glyphs, hooks and keys for Claude Code and Codex
#   agents/install      registers the agent hooks (setup.sh runs it)
#   agentd/             the agent layer's daemon (setup.sh builds it)

# --- General -----------------------------------------------------------------

set-option -g prefix M-a

# Change starting index of windows and panes to 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on               # closing a window closes the gap

# Allow mouse scroll
set -g mouse on

# autofocus required by nvim checkhealth; also marks finished agents as seen
set-option -g focus-events on

set -s escape-time 10
set -g history-limit 50000               # applies to panes created from now on
setw -g mode-keys vi                     # explicit, instead of inferred from $EDITOR
set -s set-clipboard on                  # programs inside tmux can set the clipboard (OSC 52)

# allow passthrough to pass images to tmux
set -g allow-passthrough on

# Clickable OSC 8 links in kitty (terminals re-read features when they attach)
set -s 'terminal-features[10]' 'xterm-kitty:hyperlinks'

# Needed by agent-notify and agent-jump in sessions created before a re-login
set -g 'update-environment[20]' WAYLAND_DISPLAY
set -g 'update-environment[21]' HYPRLAND_INSTANCE_SIGNATURE

# --- Keys --------------------------------------------------------------------

bind R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'

# hjkl navigation for panes
# taken from https://unix.stackexchange.com/questions/66745/tmux-remapping-keys-to-pane-on-the-left-right-top-down
# vim-like pane resizing
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# and now unbind keys
unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# --- Look and agents ---------------------------------------------------------

source-file -F '#{d:current_file}/theme.conf'
# agentd runs the agents' hooks when setup.sh installed it, unless agentd.off
# switches it off (rollback, docs/guide.md); agents.conf follows @agentd.
if-shell 'test -x "$HOME/.local/bin/agentd" && ! test -e "${XDG_STATE_HOME:-$HOME/.local/state}/tmux-agents/agentd.off"' {
  set -g @agentd "$HOME/.local/bin/agentd"
} {
  set -gu @agentd
}
source-file -F '#{d:current_file}/agents/agents.conf'

# --- Plugins -----------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# --- After plugins, so they can't override these -----------------------------

# tmux-sensible forces emacs keys in the command prompt
set -g status-keys vi

# prevent auto scrolling after copying
bind -T copy-mode-vi y send-keys -X copy-selection-no-clear
bind -T copy-mode-vi Enter send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
