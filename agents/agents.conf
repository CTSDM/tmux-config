# agents.conf: the agent pieces the theme draws, plus hooks and keys.
#
# agents/bin/agent-hook records the state of every Claude Code and Codex pane
# in pane options (@agent_state, @agent_needs, @agent_subs, @agent_tool, ...).
# This file turns them into glyphs, labels and counts; theme.conf places them
# and supplies the colors (@ac-*):
#
#   ● working      ▲ needs you (permission, question or plan)
#   ✓ done, not seen yet      ○ idle
#   ◐ turn over, subagents still running   ○゙ ◐゙ (dakuten) shells still running
#   ↻ compacting   ✗ error    ◇ agent that is not reporting (started before the hooks)
#   +N             running subagents
#
# Keys: prefix+a mission control, prefix+u jump to the agent that needs you,
# prefix+S this session's space, prefix+( ) g e move between its sessions,
# prefix+Q alerts menu (sounds on/off, mute a space).

set -gF @agents_bin '#{d:current_file}/bin'

# --- Per-pane pieces, expanded with #{E:...} in pane context ----------------

# Background work: subagents still running, or shells the agent left running
# (@agent_bg, kept by agents/bin/agent-bgwatch).
set -g @agent-background '#{||:#{e|>:#{@agent_subs},0},#{e|>:#{@agent_bg},0}}'
set -g @agent-background-label '#{?#{e|>:#{@agent_subs},0},subagents running (#{@agent_subtypes}),}#{?#{&&:#{e|>:#{@agent_subs},0},#{e|>:#{@agent_bg},0}}, · ,}#{?#{e|>:#{@agent_bg},0},#{@agent_bg} shell#{?#{==:#{@agent_bg},1},,s} running,}'

# Finished and not seen yet (the ✓): its session's name and its window's tab
# turn green until you look at the pane.
set -g @agent-unseen '#{&&:#{==:#{@agent_state},done},#{!=:#{E:@agent-background},1}}'

# A claude or codex running in a pane without @agent: an agent that is not
# reporting (◇). tmux reads /proc for pane_current_command, on every redraw;
# with agentd, a pane option it keeps (@p-untracked, agentd/src/daemon/bar.rs).
set -g @agent-untracked '#{?@agentd,#{@p-untracked},#{m/r:^(claude|codex)$,#{pane_current_command}}}'

# Glyph, empty for panes without an agent.
set -g @agent-glyph '#{?#{==:#{@agent_state},needs},#[fg=#{@ac-needs}]▲,#{==:#{@agent_state},error},#[fg=#{@ac-error}]✗,#{==:#{@agent_state},working},#[fg=#{@ac-working}]●,#{==:#{@agent_state},compacting},#[fg=#{@ac-compact}]↻,#{E:@agent-background},#[fg=#{@ac-working}]#{?#{e|>:#{@agent_subs},0},◐,○}#{?#{e|>:#{@agent_bg},0},゙,},#{==:#{@agent_state},done},#[fg=#{@ac-done}]✓,#{@agent},#[fg=#{@ac-idle}]○,#{E:@agent-untracked},#[fg=#{@ac-dim}]◇,}#{?#{e|>:#{@agent_subs},0},#[fg=#{@ac-dim}]+#{@agent_subs},}'

# State color, for borders.
set -g @agent-color '#{?#{==:#{@agent_state},needs},#{@ac-needs},#{==:#{@agent_state},error},#{@ac-error},#{==:#{@agent_state},working},#{@ac-working},#{==:#{@agent_state},compacting},#{@ac-compact},#{E:@agent-background},#{@ac-working},#{==:#{@agent_state},done},#{@ac-done},#{@ac-dim}}'

# State in words, for borders.
set -g @agent-label '#{?#{==:#{@agent_state},needs},needs #{@agent_needs},#{?#{&&:#{E:@agent-background},#{m/r:^(done|idle|ready)$,#{@agent_state}}},#{E:@agent-background-label},#{@agent_state}#{?#{e|>:#{@agent_subs},0}, (#{@agent_subtypes}),}}}'
set -ag @agent-label '#{?#{==:#{@agent_collaboration},plan}, · plan mode,}#{?#{@agent_question}, · question sent,}'

# Task name of an agent pane, from the title Claude ("✳ topic") or Codex
# ("topic | project") gives it; empty for other panes. Ends in a §§ marker.
set -g @agent-pane-task '#{?#{&&:#{||:#{@agent},#{E:@agent-untracked}},#{!=:#{pane_title},#{host}}},#{s/ \| [^|]*$//:#{s/^✳ //:pane_title}}§§,}'

# Window name: the task of its first agent pane, even when another pane is
# active, unless the window was renamed by hand.
set -g @agent-task '#{?#{&&:#{automatic-rename},#{P:#{E:@agent-pane-task}}},#{s/§§.*//:#{P:#{E:@agent-pane-task}}},#W}'

# --- Pane border labels only in split windows ---------------------------

set-hook -g 'window-layout-changed[40]' "set -wF pane-border-status '#{?#{e|>:#{window_panes},1},bottom,off}'"
run-shell -b 'for w in $(tmux list-windows -a -F "##{window_id}"); do tmux set -wF -t "$w" pane-border-status "##{?##{e|>:##{window_panes},1},bottom,off}"; done'

# --- Seen / not seen ---------------------------------------------------------

# Looking at a finished pane marks it seen and closes its desktop notification.
# With agentd (the global option @agentd names its binary), agentd does both;
# a notification bash showed (its id in @agent_notify_id, which agentd never
# writes) is closed by bash in both modes, so one shown before the switch
# still closes when seen.
# A focus change must not make the tmux server start a process (run-shell
# forks it, and a big server forks slowly): agentd hears it as a message to
# its control client (@agentd_client, while that client exists), in tmux
# itself; -l keeps the pane id (%N) from strftime. Otherwise `ctl seen`.
# In a #{L:} loop over clients, #{client_name} only behind client_session:
# a client that has just connected has no name yet, and tmux 3.6 crashes
# reading it.
set-hook -g 'pane-focus-in[40]' {
  if -F '#{@agentd}' {
    if -F '#{@agent}' {
      if -F '#{L:#{?client_session,#{?#{==:#{client_name},#{@agentd_client}},1,},}}' {
        run-shell -C "display-message -l -c '#{@agentd_client}' 'agentd seen #{hook_pane}'"
      } {
        run-shell -b '#{@agentd} ctl seen #{hook_pane}'
      }
    }
  } {
    if -F '#{==:#{@agent_state},done}' { set -p @agent_state idle }
  }
}
set-hook -g 'pane-focus-in[41]' {
  if -F '#{@agent_notify_id}' {
    run-shell -b '#{@agents_bin}/agent-notify --close #{hook_pane}'
  }
}
# Re-check missed lifecycle events when leaving a busy pane. Codex also has a
# per-pane observer while its turn or background commands are still active.
set-hook -g 'pane-focus-out[40]' {
  if -F '#{m/r:^(working|needs|compacting)$,#{@agent_state}}' {
    run-shell -b '#{@agents_bin}/agent-reconcile #{hook_pane}'
  }
}
# With agentd the top row reads values it keeps (agentd/src/daemon/bar.rs). A
# pane closing is news it gets no other way (windows and sessions its control
# client hears of): a message to that client, no process.
set-hook -g 'after-kill-pane[40]' {
  if -F '#{&&:#{@agentd},#{@agentd_client}}' { run-shell -C "display-message -c '#{@agentd_client}' 'agentd bar'" }
}
set-hook -g 'pane-exited[40]' {
  if -F '#{&&:#{@agentd},#{@agentd_client}}' { run-shell -C "display-message -c '#{@agentd_client}' 'agentd bar'" }
}
# agentd, when the global option @agentd names its binary (design.md, "The
# switch"): start its daemon for this server.
if -F '#{@agentd}' { run-shell -b '#{@agentd} ensure' }
run-shell -b '#{@agents_bin}/agent-reconcile'
# The "turn signal" on whatever needs you (it exits at once if nothing does):
# agentd's with @agentd, else agent-blink.
if -F '#{@agentd}' { run-shell -b '#{@agentd} ctl blink' } { run-shell -b '#{@agents_bin}/agent-blink' }

# --- Spaces: personal and work sessions apart ---------------------------------

# Tags sessions from spaces.conf and gives each its space's second status line
# (template in theme.conf). prefix+S picks a session's space by hand.
run-shell '#{@agents_bin}/agent-spaces load'
# q: a session name is text, never shell (a name like `a b;cmd`).
set-hook -g 'session-created[40]' { run-shell -b '#{@agents_bin}/agent-spaces assign #{q:hook_session_name}' }
set-hook -g 'session-closed[40]' { run-shell -b '#{@agents_bin}/agent-spaces assign' }
set-hook -g 'session-renamed[40]' { run-shell -b '#{@agents_bin}/agent-spaces assign' }
# More rows when a terminal is too narrow for the bar (a vertical screen).
set-hook -g 'client-resized[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }
set-hook -g 'client-attached[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }
# A window opened or closed changes the tab rows (not window-renamed:
# automatic-rename fires it all the time). Opening one starts a process
# anyway, so the fork goes unnoticed there.
set-hook -g 'window-linked[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }
set-hook -g 'window-unlinked[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }
# A switch of session lays out again only if that session was laid out for
# another width (@layout-width): no process per switch. In this hook
# #{client_width} is some client of the session; the switching one is
# #{hook_client} (its name read only behind client_session: see
# pane-focus-in[40]).
set-hook -g 'client-session-changed[40]' {
  if -F '#{!=:#{L:#{?client_session,#{?#{==:#{client_name},#{hook_client}},#{client_width},},}},#{@layout-width}}' {
    run-shell -b '#{@agents_bin}/agent-spaces layout'
  }
}

# Moving between the sessions of your space, in the top bar's order (never
# into another space): prefix+( and ) previous/next (repeatable), prefix+g
# then 1-9 by number, prefix+e search. prefix+L (tmux's own) goes back.
bind -r ( run-shell -b "#{@agents_bin}/agent-spaces prev '#{client_name}'"
bind -r ) run-shell -b "#{@agents_bin}/agent-spaces next '#{client_name}'"
bind g switch-client -T space-go
# prefix+g then N, in tmux itself (no process): the session numbered N in the
# client's space (@space-index-<space>, the top row's numbers, kept by
# agent-spaces), as its id; empty when there is none. XSPACEX, NN and @@N@@
# are replaced before the second expansion.
set -g @space-go-target '#{s/@.*//:#{E:#{s/XSPACEX/#{?@space,#{@space},#{@space_auto}}/:#{s/NN/@@N@@/:#{l:#{S:#{?#{&&:#{==:#{?@space,#{@space},#{@space_auto}},XSPACEX},#{==:#{@space-index-XSPACEX},NN}},#{session_id}@,}}}}}}}'
bind -T space-go 1 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/1/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/1/:#{@space-go-target}}}'" } { display-message 'No session 1 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 2 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/2/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/2/:#{@space-go-target}}}'" } { display-message 'No session 2 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 3 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/3/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/3/:#{@space-go-target}}}'" } { display-message 'No session 3 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 4 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/4/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/4/:#{@space-go-target}}}'" } { display-message 'No session 4 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 5 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/5/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/5/:#{@space-go-target}}}'" } { display-message 'No session 5 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 6 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/6/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/6/:#{@space-go-target}}}'" } { display-message 'No session 6 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 7 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/7/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/7/:#{@space-go-target}}}'" } { display-message 'No session 7 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 8 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/8/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/8/:#{@space-go-target}}}'" } { display-message 'No session 8 in #{?@space,#{@space},#{@space_auto}}' } }
bind -T space-go 9 if -F '#{m:_peek-*,#{session_name}}' {} { if -F '#{E:#{s/@@N@@/9/:#{@space-go-target}}}' { run-shell -C "switch-client -t '#{E:#{s/@@N@@/9/:#{@space-go-target}}}'" } { display-message 'No session 9 in #{?@space,#{@space},#{@space_auto}}' } }
bind e run-shell -b "#{@agents_bin}/agent-sessions --popup '#{client_name}'"
# A new session: a small form (name, path with Tab completion) in a popup.
bind N run-shell -b "#{@agents_bin}/agent-new --popup '#{client_name}'"

# --- Out of sight: peek sessions and agentd's own (contract Z1) ---------------

# tmux's own prefix+s, w and D without the peek sessions (_peek-*: agent-peek's
# and agentd's) and without agentd's control-mode client.
bind s choose-tree -Zs -f '#{?#{m:_peek-*,#{session_name}},0,1}'
bind w choose-tree -Zw -f '#{?#{m:_peek-*,#{session_name}},0,1}'
bind D choose-client -Z -f '#{==:#{client_control_mode},0}'
# A plain `tmux attach` takes the most recently active session when every one
# has a client, and right after agentd attaches that is agentd's own. A client
# of yours that lands there (attach, switch-client) goes on to your most recent
# session, by id (run-shell -C: switch-client doesn't expand formats). Its last
# session is then agentd's, so the first prefix+L after a plain attach does
# nothing. agent-peek's _peek-* sessions are left alone: it puts you there.
set-hook -g 'client-session-changed[41]' {
  if -F '#{&&:#{==:#{client_session},_peek-agentd},#{==:#{client_control_mode},0}}' {
    run-shell -C "switch-client -c '#{hook_client}' -t '#{s/@.*//:#{S/t:#{?#{m:_peek-*,#{session_name}},,#{session_id}@}}}'"
  }
}

# --- Sounds (agents/bin/agent-sound) --------------------------------------------

# Files go in ~/.local/share/tmux-agents/sounds (see agent-sound for the names).
# Optional: set -g @agent_sound_volume 0.6    set -g @agent_remind_after 900
#           set -g @agent_test_regex '<bash regex for test commands>'
# prefix+Q, the alerts menu (sounds on/off, mute a space), is bound by
# agents/bin/agent-spaces load, which knows the spaces.

# --- Keys --------------------------------------------------------------------

# Mission control. Inside a peek session the same key closes the peek.
# (display-popup doesn't expand formats, so the script opens its own popup.)
bind a if -F '#{m:_peek-*,#{session_name}}' { detach-client } {
  run-shell -b "#{@agents_bin}/agent-board --popup '#{client_name}'"
}
bind u run-shell -b "#{@agents_bin}/agent-next '#{client_name}'"
