# agents.conf: agent-aware status bar, pane borders and keys.
#
# agents/bin/agent-hook records the state of every Claude Code and Codex pane
# in pane options (@agent_state, @agent_needs, @agent_subs, @agent_tool, ...).
# This file only decides how that looks:
#
#   ● working      ▲ needs you (permission, question or plan)
#   ✓ done, not seen yet      ○ idle      ◐ subagents still running
#   ↻ compacting   ✗ error    ◇ agent that is not reporting (started before the hooks)
#   +N             running subagents
#
# Keys: prefix+a mission control, prefix+u jump to the agent that needs you.

set -gF @agents_bin '#{d:current_file}/bin'

# --- Palette (Catppuccin Mocha) ----------------------------------------------

set -g @ac-working '#89b4fa'
set -g @ac-needs   '#fab387'
set -g @ac-done    '#a6e3a1'
set -g @ac-error   '#f38ba8'
set -g @ac-compact '#cba6f7'
set -g @ac-idle    '#9399b2'
set -g @ac-text    '#cdd6f4'
set -g @ac-dim     '#6c7086'
set -g @ac-accent  '#89dceb'

# --- Per-pane pieces, expanded with #{E:...} in pane context ----------------

# Glyph, empty for panes without an agent.
set -g @agent-glyph '#{?#{==:#{@agent_state},needs},#[fg=#{@ac-needs}]▲,#{==:#{@agent_state},error},#[fg=#{@ac-error}]✗,#{==:#{@agent_state},working},#[fg=#{@ac-working}]●,#{==:#{@agent_state},compacting},#[fg=#{@ac-compact}]↻,#{e|>:#{@agent_subs},0},#[fg=#{@ac-working}]◐,#{==:#{@agent_state},done},#[fg=#{@ac-done}]✓,#{@agent},#[fg=#{@ac-idle}]○,#{m/r:^(claude|codex)$,#{pane_current_command}},#[fg=#{@ac-dim}]◇,}#{?#{e|>:#{@agent_subs},0},#[fg=#{@ac-dim}]+#{@agent_subs},}'

# State color, for borders.
set -g @agent-color '#{?#{==:#{@agent_state},needs},#{@ac-needs},#{==:#{@agent_state},error},#{@ac-error},#{==:#{@agent_state},working},#{@ac-working},#{==:#{@agent_state},compacting},#{@ac-compact},#{==:#{@agent_state},done},#{@ac-done},#{@ac-dim}}'

# State in words, for borders.
set -g @agent-label '#{?#{==:#{@agent_state},needs},needs #{@agent_needs},#{?#{&&:#{e|>:#{@agent_subs},0},#{m/r:^(done|idle|ready)$,#{@agent_state}}},subagents running,#{@agent_state}}}#{?#{e|>:#{@agent_subs},0}, (#{@agent_subtypes}),}'

# Task name of an agent pane, from the title Claude ("✳ topic") or Codex
# ("topic | project") gives it; empty for other panes. Ends in a §§ marker.
set -g @agent-pane-task '#{?#{&&:#{||:#{@agent},#{m/r:^(claude|codex)$,#{pane_current_command}}},#{!=:#{pane_title},#{host}}},#{s/ \| [^|]*$//:#{s/^✳ //:pane_title}}§§,}'

# Window name: the task of its first agent pane, even when another pane is
# active, unless the window was renamed by hand.
set -g @agent-task '#{?#{&&:#{automatic-rename},#{P:#{E:@agent-pane-task}}},#{s/§§.*//:#{P:#{E:@agent-pane-task}}},#W}'

# Every agent pane of every session except peek sessions, filtered by state.
set -g @agent-count-needs   '#{n:#{S:#{?#{m:_peek-*,#{session_name}},,#{W:#{P:#{?#{==:#{@agent_state},needs},x,}}}}}}'
set -g @agent-count-done    '#{n:#{S:#{?#{m:_peek-*,#{session_name}},,#{W:#{P:#{?#{&&:#{==:#{@agent_state},done},#{e|<:#{@agent_subs},1}},x,}}}}}}'
set -g @agent-count-working '#{n:#{S:#{?#{m:_peek-*,#{session_name}},,#{W:#{P:#{?#{||:#{m/r:^(working|compacting)$,#{@agent_state}},#{e|>:#{@agent_subs},0}},x,}}}}}}'

# --- Status bar: windows on the first line, every session's agents below ----

set -g status 2
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=default,fg=#cdd6f4'
set -g status-left-length 40
set -g status-left '#[fg=#{@ac-accent},bold] #{?#{m:_peek-*,#{session_name}},peek: #{session_group},#S} #[default]'
set -g status-right-length 40
set -g status-right '#[fg=#{@ac-dim}]%H:%M '

set -g window-status-separator ''
set -g window-status-format ' #[fg=#{@ac-dim}]#I #{?#{P:#{E:@agent-glyph}},#{P:#{E:@agent-glyph}}#[fg=#{@ac-dim}] ,}#{=/24/…:#{E:@agent-task}}#{?window_zoomed_flag, Z,}#{?window_bell_flag,#[fg=#{@ac-needs}] !,} '
set -g window-status-current-format ' #[fg=#{@ac-accent},bold]#I#[nobold] #{?#{P:#{E:@agent-glyph}},#{P:#{E:@agent-glyph}} ,}#[fg=#{@ac-text},bold]#{=/24/…:#{E:@agent-task}}#[nobold]#{?window_zoomed_flag, Z,} '

set -g 'status-format[1]' '#[align=left]#{S:#{?#{m:_peek-*,#{session_name}},,#{?#{W:#{P:#{E:@agent-glyph}}}, #{?#{==:#{session_name},#{client_session}},#[fg=#{@ac-text}]#[bold],#[fg=#{@ac-dim}]}#{=/16/…:session_name}#[nobold] #{W:#{P:#{E:@agent-glyph}}}#[default]  ,}}}#[align=right]#{?#{!=:#{E:@agent-count-needs},0},#[fg=#{@ac-needs}]▲ #{E:@agent-count-needs} need you  ,}#{?#{!=:#{E:@agent-count-done},0},#[fg=#{@ac-done}]✓ #{E:@agent-count-done} done  ,}#{?#{!=:#{E:@agent-count-working},0},#[fg=#{@ac-working}]● #{E:@agent-count-working} working ,}'

# --- Pane borders: the state color is the "ring"; labels only in split windows

set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-format ' #{?@agent,#{E:@agent-glyph}#[fg=#{E:@agent-color}] #{@agent}#{?#{&&:#{==:#{@agent},claude},#{!=:#{@agent_profile},default}},:#{@agent_profile},} · #{E:@agent-label}#{?@agent_tool, · #{=/50/…:@agent_tool},},#[fg=#{@ac-dim}]#{pane_index} #{pane_current_command}} '
set -g pane-border-style 'fg=#{?@agent,#{E:@agent-color},#{@ac-dim}}'
set -g pane-active-border-style 'fg=#{?@agent,#{E:@agent-color},#{@ac-accent}}'

set-hook -g 'window-layout-changed[40]' "set -wF pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"
run-shell -b 'for w in $(tmux list-windows -a -F "##{window_id}"); do tmux set -wF -t "$w" pane-border-status "##{?##{e|>:##{window_panes},1},top,off}"; done'

# --- Seen / not seen ---------------------------------------------------------

# Looking at a finished pane marks it seen and closes its desktop notification.
set-hook -g 'pane-focus-in[40]' {
  if -F '#{==:#{@agent_state},done}' { set -p @agent_state idle }
}
set-hook -g 'pane-focus-in[41]' {
  if -F '#{@agent_notify_id}' { run-shell -b '#{@agents_bin}/agent-notify --close #{hook_pane}' }
}
# Esc and denied permissions end a turn without any hook: re-check a pane
# that still looks busy when you leave it.
set-hook -g 'pane-focus-out[40]' {
  if -F '#{m/r:^(working|needs|compacting)$,#{@agent_state}}' {
    run-shell -b '#{@agents_bin}/agent-reconcile #{hook_pane}'
  }
}
run-shell -b '#{@agents_bin}/agent-reconcile'

# --- Keys --------------------------------------------------------------------

set -g popup-border-lines rounded
set -g popup-border-style 'fg=#45475a'

# Mission control. Inside a peek session the same key closes the peek.
# (display-popup doesn't expand formats, so the script opens its own popup.)
bind a if -F '#{m:_peek-*,#{session_name}}' { detach-client } {
  run-shell -b "#{@agents_bin}/agent-board --popup '#{client_name}'"
}
bind u run-shell -b "#{@agents_bin}/agent-next '#{client_name}'"
