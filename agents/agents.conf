# agents.conf: the agent pieces the theme draws, plus hooks and keys.
#
# agents/bin/agent-hook records the state of every Claude Code and Codex pane
# in pane options (@agent_state, @agent_needs, @agent_subs, @agent_tool, ...).
# This file turns them into glyphs, labels and counts; theme.conf places them
# and supplies the colors (@ac-*):
#
#   ● working      ▲ needs you (permission, question or plan)
#   ✓ done, not seen yet      ○ idle      ◐ subagents or shells still running
#   ↻ compacting   ✗ error    ◇ agent that is not reporting (started before the hooks)
#   +N             running subagents
#
# Keys: prefix+a mission control, prefix+u jump to the agent that needs you,
# prefix+S this session's space, prefix+( ) g e move between its sessions,
# prefix+Q alerts menu (sounds on/off, mute a space).

set -gF @agents_bin '#{d:current_file}/bin'

# --- Per-pane pieces, expanded with #{E:...} in pane context ----------------

# Background work: subagents still running, or shells the agent left running
# (@agent_bg, kept by agents/bin/agent-bgwatch).
set -g @agent-background '#{||:#{e|>:#{@agent_subs},0},#{e|>:#{@agent_bg},0}}'
set -g @agent-background-label '#{?#{e|>:#{@agent_subs},0},subagents running (#{@agent_subtypes}),}#{?#{&&:#{e|>:#{@agent_subs},0},#{e|>:#{@agent_bg},0}}, · ,}#{?#{e|>:#{@agent_bg},0},#{@agent_bg} shell#{?#{==:#{@agent_bg},1},,s} running,}'

# Finished and not seen yet (the ✓): its session's name and its window's tab
# turn green until you look at the pane.
set -g @agent-unseen '#{&&:#{==:#{@agent_state},done},#{!=:#{E:@agent-background},1}}'

# Glyph, empty for panes without an agent.
set -g @agent-glyph '#{?#{==:#{@agent_state},needs},#[fg=#{@ac-needs}]▲,#{==:#{@agent_state},error},#[fg=#{@ac-error}]✗,#{==:#{@agent_state},working},#[fg=#{@ac-working}]●,#{==:#{@agent_state},compacting},#[fg=#{@ac-compact}]↻,#{E:@agent-background},#[fg=#{@ac-working}]◐,#{==:#{@agent_state},done},#[fg=#{@ac-done}]✓,#{@agent},#[fg=#{@ac-idle}]○,#{m/r:^(claude|codex)$,#{pane_current_command}},#[fg=#{@ac-dim}]◇,}#{?#{e|>:#{@agent_subs},0},#[fg=#{@ac-dim}]+#{@agent_subs},}'

# State color, for borders.
set -g @agent-color '#{?#{==:#{@agent_state},needs},#{@ac-needs},#{==:#{@agent_state},error},#{@ac-error},#{==:#{@agent_state},working},#{@ac-working},#{==:#{@agent_state},compacting},#{@ac-compact},#{E:@agent-background},#{@ac-working},#{==:#{@agent_state},done},#{@ac-done},#{@ac-dim}}'

# State in words, for borders.
set -g @agent-label '#{?#{==:#{@agent_state},needs},needs #{@agent_needs},#{?#{&&:#{E:@agent-background},#{m/r:^(done|idle|ready)$,#{@agent_state}}},#{E:@agent-background-label},#{@agent_state}#{?#{e|>:#{@agent_subs},0}, (#{@agent_subtypes}),}}}'
set -ag @agent-label '#{?#{==:#{@agent_collaboration},plan}, · plan mode,}#{?#{@agent_question}, · question sent,}'

# Task name of an agent pane, from the title Claude ("✳ topic") or Codex
# ("topic | project") gives it; empty for other panes. Ends in a §§ marker.
set -g @agent-pane-task '#{?#{&&:#{||:#{@agent},#{m/r:^(claude|codex)$,#{pane_current_command}}},#{!=:#{pane_title},#{host}}},#{s/ \| [^|]*$//:#{s/^✳ //:pane_title}}§§,}'

# Window name: the task of its first agent pane, even when another pane is
# active, unless the window was renamed by hand.
set -g @agent-task '#{?#{&&:#{automatic-rename},#{P:#{E:@agent-pane-task}}},#{s/§§.*//:#{P:#{E:@agent-pane-task}}},#W}'

# --- Pane border labels only in split windows ---------------------------

set-hook -g 'window-layout-changed[40]' "set -wF pane-border-status '#{?#{e|>:#{window_panes},1},bottom,off}'"
run-shell -b 'for w in $(tmux list-windows -a -F "##{window_id}"); do tmux set -wF -t "$w" pane-border-status "##{?##{e|>:##{window_panes},1},bottom,off}"; done'

# --- Seen / not seen ---------------------------------------------------------

# Looking at a finished pane marks it seen and closes its desktop notification.
# With agentd (the global option @agentd names its binary), agentd does both.
set-hook -g 'pane-focus-in[40]' {
  if -F '#{@agentd}' {
    if -F '#{@agent}' { run-shell -b '#{@agentd} ctl seen #{hook_pane}' }
  } {
    if -F '#{==:#{@agent_state},done}' { set -p @agent_state idle }
  }
}
set-hook -g 'pane-focus-in[41]' {
  if -F '#{&&:#{==:#{@agentd},},#{@agent_notify_id}}' {
    run-shell -b '#{@agents_bin}/agent-notify --close #{hook_pane}'
  }
}
# Re-check missed lifecycle events when leaving a busy pane. Codex also has a
# per-pane observer while its turn or background commands are still active.
set-hook -g 'pane-focus-out[40]' {
  if -F '#{m/r:^(working|needs|compacting)$,#{@agent_state}}' {
    run-shell -b '#{@agents_bin}/agent-reconcile #{hook_pane}'
  }
}
# agentd, when the global option @agentd names its binary (design.md, "The
# switch"): start its daemon for this server.
if -F '#{@agentd}' { run-shell -b '#{@agentd} ensure' }
run-shell -b '#{@agents_bin}/agent-reconcile'
# The "turn signal" on whatever needs you (it exits at once if nothing does).
run-shell -b '#{@agents_bin}/agent-blink'

# --- Spaces: personal and work sessions apart ---------------------------------

# Tags sessions from spaces.conf and gives each its space's second status line
# (template in theme.conf). prefix+S picks a session's space by hand.
run-shell '#{@agents_bin}/agent-spaces load'
set-hook -g 'session-created[40]' { run-shell -b '#{@agents_bin}/agent-spaces assign #{hook_session_name}' }
set-hook -g 'session-closed[40]' { run-shell -b '#{@agents_bin}/agent-spaces assign' }
set-hook -g 'session-renamed[40]' { run-shell -b '#{@agents_bin}/agent-spaces assign' }
# More rows when a terminal is too narrow for the bar (a vertical screen).
set-hook -g 'client-resized[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }
set-hook -g 'client-attached[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }
set-hook -g 'client-session-changed[40]' { run-shell -b '#{@agents_bin}/agent-spaces layout' }

# Moving between the sessions of your space, in the top bar's order (never
# into another space): prefix+( and ) previous/next (repeatable), prefix+g
# then 1-9 by number, prefix+e search. prefix+L (tmux's own) goes back.
bind -r ( run-shell -b "#{@agents_bin}/agent-spaces prev '#{client_name}'"
bind -r ) run-shell -b "#{@agents_bin}/agent-spaces next '#{client_name}'"
bind g switch-client -T space-go
bind -T space-go 1 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 1"
bind -T space-go 2 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 2"
bind -T space-go 3 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 3"
bind -T space-go 4 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 4"
bind -T space-go 5 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 5"
bind -T space-go 6 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 6"
bind -T space-go 7 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 7"
bind -T space-go 8 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 8"
bind -T space-go 9 run-shell -b "#{@agents_bin}/agent-spaces go '#{client_name}' 9"
bind e run-shell -b "#{@agents_bin}/agent-sessions --popup '#{client_name}'"
# A new session: a small form (name, path with Tab completion) in a popup.
bind N run-shell -b "#{@agents_bin}/agent-new --popup '#{client_name}'"

# --- Sounds (agents/bin/agent-sound) --------------------------------------------

# Files go in ~/.local/share/tmux-agents/sounds (see agent-sound for the names).
# Optional: set -g @agent_sound_volume 0.6    set -g @agent_remind_after 900
#           set -g @agent_test_regex '<bash regex for test commands>'
# prefix+Q, the alerts menu (sounds on/off, mute a space), is bound by
# agents/bin/agent-spaces load, which knows the spaces.

# --- Keys --------------------------------------------------------------------

# Mission control. Inside a peek session the same key closes the peek.
# (display-popup doesn't expand formats, so the script opens its own popup.)
bind a if -F '#{m:_peek-*,#{session_name}}' { detach-client } {
  run-shell -b "#{@agents_bin}/agent-board --popup '#{client_name}'"
}
bind u run-shell -b "#{@agents_bin}/agent-next '#{client_name}'"
